[build]
builder = "RAILPACK"
buildCommand = "python manage.py collectstatic --noinput --settings=todoback.settings.production"

[deploy]
preDeployCommand = "python manage.py migrate --settings=todoback.settings.production"
startCommand = "gunicorn todoback.wsgi:application --bind 0.0.0.0:$PORT"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
